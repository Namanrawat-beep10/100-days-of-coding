name: Daily 100 Days of C

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

concurrency:
  group: daily-100-days-c
  cancel-in-progress: false

jobs:
  solve-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate and compile today's solutions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python automation/daily_code.py

      - name: Commit and push
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'day*-q*.c'
          DAY=$(git diff --cached --name-only | sed -n 's/^day\([0-9][0-9]*\)-q[0-9][0-9]*\.c$/\1/p' | head -1)
          git commit -m "Complete Day ${DAY} of 100 Days of Code"
          git push
